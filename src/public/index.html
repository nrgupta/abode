<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apartment Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { font-size: 1.4rem; }

    .layout {
      display: flex;
      min-height: calc(100vh - 61px);
    }

    /* ── Sidebar ── */
    aside {
      width: 300px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 10px;
    }

    /* Sources checkboxes */
    .source-list { display: flex; flex-direction: column; gap: 10px; }
    .source-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .source-item input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: #0071e3;
      cursor: pointer;
    }
    .source-item label {
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .source-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f0f0f0;
      color: #555;
    }

    /* Inputs */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.85rem; font-weight: 500; color: #444; }
    .field input {
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .15s;
      width: 100%;
    }
    .field input:focus { border-color: #0071e3; }

    .field-row { display: flex; gap: 10px; }
    .field-row .field { flex: 1; }

    /* Search button */
    button#searchBtn {
      width: 100%;
      padding: 11px;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    button#searchBtn:hover { background: #005bbf; }
    button#searchBtn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Main content ── */
    main {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
    }

    .status-bar {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 18px;
      min-height: 20px;
    }

    /* Source sections */
    .source-section { margin-bottom: 36px; }
    .source-section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .count-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: #e8f0fe;
      color: #0071e3;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* Cards grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      color: #1d1d1f;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0071e3;
    }

    .card-location {
      font-size: 0.8rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-meta {
      display: flex;
      gap: 10px;
      font-size: 0.78rem;
      color: #555;
      flex-wrap: wrap;
    }
    .card-meta span {
      background: #f5f5f7;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: #0071e3;
      text-decoration: none;
    }
    .card-link:hover { text-decoration: underline; }

    /* Empty / loading states */
    .empty {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      padding: 60px 0;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #ccc;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      background: #fdf0ef;
      border: 1px solid #f5c6c2;
      border-radius: 8px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>

<header>
  <span>🏠</span>
  <h1>Apartment Finder — Chicago</h1>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside>

    <button id="searchBtn">Search</button>

    <div>
      <div class="section-label">Sources</div>
      <div class="source-list">
        <div class="source-item">
          <input type="checkbox" id="src-craigslist" value="craigslist" checked />
          <label for="src-craigslist">Craigslist</label>
        </div>
        <div class="source-item">
          <input type="checkbox" id="src-apartments" value="apartments" checked />
          <label for="src-apartments">Redfin</label>
        </div>
        <div class="source-item">
          <input type="checkbox" id="src-zillow" value="zillow" checked />
          <label for="src-zillow">Zillow</label>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Bedrooms</div>
      <div class="field-row">
        <div class="field">
          <label for="minBeds">Min</label>
          <input type="number" id="minBeds" min="0" max="10" value="2" placeholder="2" />
        </div>
        <div class="field">
          <label for="maxBeds">Max</label>
          <input type="number" id="maxBeds" min="0" max="10" value="2" placeholder="2" />
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">Bathrooms</div>
      <div class="field">
        <label for="minBaths">Min bathrooms</label>
        <input type="number" id="minBaths" min="0" max="10" step="0.5" value="1" placeholder="1" />
      </div>
    </div>

    <div>
      <div class="section-label">Monthly Rent</div>
      <div class="field-row">
        <div class="field">
          <label for="minRent">Min ($)</label>
          <input type="number" id="minRent" min="0" value="0" placeholder="0" />
        </div>
        <div class="field">
          <label for="maxRent">Max ($)</label>
          <input type="number" id="maxRent" min="0" value="3000" placeholder="3000" />
        </div>
      </div>
    </div>

  </aside>

  <!-- ── Results ── -->
  <main>
    <div class="status-bar" id="statusBar">Configure filters and click Search.</div>
    <div id="results"></div>
  </main>

</div>

<script>
  const searchBtn  = document.getElementById("searchBtn");
  const statusBar  = document.getElementById("statusBar");
  const resultsDiv = document.getElementById("results");

  searchBtn.addEventListener("click", runSearch);

  async function runSearch() {
    const sources = Array.from(
      document.querySelectorAll(".source-list input:checked")
    ).map(el => el.value);

    if (sources.length === 0) {
      statusBar.textContent = "Select at least one source.";
      return;
    }

    const minBeds  = parseInt(document.getElementById("minBeds").value)  || 1;
    const maxBeds  = parseInt(document.getElementById("maxBeds").value)  || minBeds;
    const minBaths = parseFloat(document.getElementById("minBaths").value) || 1;
    const minRent  = parseInt(document.getElementById("minRent").value)  || 0;
    const maxRent  = parseInt(document.getElementById("maxRent").value)  || 3000;

    searchBtn.disabled = true;
    statusBar.innerHTML = `<span class="spinner"></span>Scraping ${sources.join(", ")}…`;
    resultsDiv.innerHTML = "";

    try {
      const res = await fetch("/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sources, bedrooms: minBeds, maxBedrooms: maxBeds, minBaths, minRent, maxRent }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();

      statusBar.textContent = `Found ${data.total} listing${data.total !== 1 ? "s" : ""} across ${sources.length} source${sources.length !== 1 ? "s" : ""}.`;
      renderResults(data.results);
    } catch (err) {
      statusBar.textContent = "";
      resultsDiv.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
    } finally {
      searchBtn.disabled = false;
    }
  }

  const SOURCE_ORDER = ["Zillow", "Redfin", "Craigslist"];

  function renderResults(results) {
    const entries = Object.entries(results)
      .sort(([a], [b]) => {
        const ai = SOURCE_ORDER.indexOf(a);
        const bi = SOURCE_ORDER.indexOf(b);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });
    if (entries.every(([, listings]) => listings.length === 0)) {
      resultsDiv.innerHTML = `<div class="empty">No listings found. Try adjusting your filters.</div>`;
      return;
    }

    resultsDiv.innerHTML = entries.map(([source, listings]) => {
      if (listings.length === 0) return "";
      return `
        <div class="source-section">
          <h2>${source} <span class="count-badge">${listings.length}</span></h2>
          <div class="cards">
            ${listings.map(card).join("")}
          </div>
        </div>`;
    }).join("");
  }

  function card(l) {
    const meta = [
      l.beds  ? `🛏 ${l.beds} bed`  : "",
      l.baths ? `🚿 ${l.baths} bath` : "",
      l.sqft  ? `📐 ${l.sqft} sqft`  : "",
    ].filter(Boolean);

    return `
      <div class="card">
        <div class="card-title">${esc(l.title) || esc(l.location) || "Untitled listing"}</div>
        <div class="card-price">${esc(l.price) || "—"}</div>
        <div class="card-location">📍 ${esc(l.location) || "Chicago, IL"}</div>
        ${meta.length ? `<div class="card-meta">${meta.map(m => `<span>${m}</span>`).join("")}</div>` : ""}
        ${l.url ? `<a class="card-link" href="${esc(l.url)}" target="_blank" rel="noopener">View listing →</a>` : ""}
      </div>`;
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>

</body>
</html>
